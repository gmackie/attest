name: Token Demo UX

on:
  pull_request:
    paths:
      - "apps/web/src/**"
      - "packages/demo/src/token-story.ts"
      - "packages/demo/test/token-story.test.ts"
      - "specs/token-animation-guide.md"
      - ".github/workflows/token-demos.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  token-animation:
    runs-on: apps
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      # Node 26.13.1 + pnpm (packageManager), the runner's /pnpm-store mount,
      # `pnpm install --frozen-lockfile` with retries (no setup-node cache).
      - name: Setup toolchain and install
        uses: https://git.forgegraf.com/gmackie/ci-actions/fleet/setup@ddd693744c0254b1cb078eec0e4d5a1bc38f57eb
        with:
          node-version: 26.13.1
          registry-token: ${{ secrets.FG_REGISTRY_TOKEN }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ci
      - name: Compile reference contract artifacts for the UI
        run: pnpm --filter @attest/contracts build
      - name: Typecheck interactive React/Kumo demos
        run: pnpm typecheck
      - name: Verify seven scenes and conservation mathematics
        run: pnpm exec vitest run packages/demo/test/token-story.test.ts
      - name: Bundle production website
        run: pnpm --filter @attest/web build
