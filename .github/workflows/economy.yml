name: ATTEST Economy POC

on:
  pull_request:
    paths:
      - "contracts/src/AttestEconomy.sol"
      - "contracts/scripts/compile.mjs"
      - "packages/chain-evm/src/economy.ts"
      - "packages/chain-evm/test/economy*.test.ts"
      - "packages/demo/src/conversion.ts"
      - "packages/demo/test/conversion.test.ts"
      - "apps/web/src/EconomyLab.tsx"
      - "apps/web/src/economy.css"
      - ".github/workflows/economy.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  economy:
    runs-on: apps
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      # Node 26.13.1 + pnpm (packageManager), the runner's /pnpm-store mount,
      # `pnpm install --frozen-lockfile` with retries (no setup-node cache).
      - name: Setup toolchain and install
        uses: https://git.forgegraf.com/gmackie/ci-actions/fleet/setup@ddd693744c0254b1cb078eec0e4d5a1bc38f57eb
        with:
          node-version: 26.13.1
          registry-token: ${{ secrets.FG_REGISTRY_TOKEN }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ci
      - run: pnpm --filter @attest/contracts build
      - run: pnpm typecheck
      - run: pnpm exec vitest run packages/chain-evm/test/economy.test.ts packages/chain-evm/test/economy-e2e.test.ts packages/demo/test/conversion.test.ts
