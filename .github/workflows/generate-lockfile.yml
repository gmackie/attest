name: Generate lockfile

on:
  push:
    branches: [feat/assurance-kernel-poc]
    paths:
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assurance-kernel-poc
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git diff --cached --quiet || git commit -m 'chore: lock workspace dependencies'
          git push origin HEAD:feat/assurance-kernel-poc
