name: Bootstrap implementation

on:
  push:
    branches: [feat/assurance-kernel-poc]
    paths:
      - .bootstrap/attest-implementation.tar.gz.b64
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assurance-kernel-poc
      - name: Expand implementation tree
        run: |
          base64 --decode .bootstrap/attest-implementation.tar.gz.b64 > /tmp/attest-implementation.tar.gz
          tar -xzf /tmp/attest-implementation.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: build private assurance proof of concept'
          git push origin HEAD:feat/assurance-kernel-poc
