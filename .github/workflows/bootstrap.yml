name: Bootstrap implementation

on:
  push:
    branches: [feat/assurance-kernel-poc]
    paths:
      - .bootstrap/payload-*
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assurance-kernel-poc
      - name: Expand implementation tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload-* | tr -d '\n\r ' | base64 --decode > /tmp/attest-implementation.tar.gz
          echo 'ef675cd1016c9f6e766ab46a666a8f753ab426001dcc0aba0f42a9b53df050fb  /tmp/attest-implementation.tar.gz' | sha256sum --check
          tar -xzf /tmp/attest-implementation.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml .github/workflows/ci.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: build private assurance proof of concept'
          git push origin HEAD:feat/assurance-kernel-poc
