name: Native ATTEST ZK (experimental)

on:
  pull_request:
    paths:
      - "zk/**"
      - "contracts/src/AttestZkMinter.sol"
      - "contracts/src/AttestEconomy.sol"
      - "contracts/scripts/compile.mjs"
      - "contracts/scripts/compile-zk.mjs"
      - "packages/chain-evm/src/economy.ts"
      - ".github/workflows/native-zk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-zk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install pinned main repository dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated circuit toolchain (TEST ONLY)
        run: |
          mkdir -p /tmp/attest-zk-toolchain
          npm install --prefix /tmp/attest-zk-toolchain --no-save --no-package-lock --no-audit --no-fund \
            circom2@0.2.23 circomlib@2.0.5 circomlibjs@0.1.7 snarkjs@0.7.5
      - name: Compile Circom and generate ephemeral, INSECURE test proving keys
        run: node zk/scripts/build-test-fixture.mjs
      - name: Compile generated Groth16 verifier and token contracts
        run: |
          pnpm --filter @attest/contracts build
          node contracts/scripts/compile-zk.mjs
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Native proof and Anvil end-to-end verification
        run: pnpm exec vitest run packages/chain-evm/test/economy-native-zk.test.ts
      - name: Print experimental verifier fingerprints
        if: always()
        run: |
          if [ -f zk/.generated/manifest.json ]; then
            cat zk/.generated/manifest.json
          fi
